name: Monthly cost field canary

on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch: {}

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Cursor cost fields are numeric, never null
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: python3 canary/cost_field_canary.py
